services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      # env_file's ./data path is relative to the host repo; inside the
      # container the mounted volume is /data.
      DATABASE_PATH: /data/autopilot.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      FASTAPI_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
